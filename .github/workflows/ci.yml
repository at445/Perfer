name: CI

# Pull requests (any target) and pushes to main/develop: build the project
# and run the full test suite (unit + acceptance) with coverage.
on:
  pull_request:
  push:
    branches: [main, develop]

env:
  LLVM_VERSION: llvmorg-22.1.8
  # Directory the prebuilt LLVM/MLIR is unpacked into (see llvm-cache.yml).
  LLVM_BUILD_DIR: ${{ github.workspace }}/llvm-install

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore the prebuilt LLVM/MLIR. On a cache miss (first run, or after
      # bumping LLVM_VERSION) the steps below build it from source and the
      # cache action stores the result for subsequent runs.
      - name: Restore prebuilt LLVM/MLIR
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_BUILD_DIR }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-release

      - name: Clone LLVM (pinned version)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.LLVM_VERSION }} \
            https://github.com/llvm/llvm-project.git llvm-project

      - name: Build LLVM + MLIR (first run only)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ env.LLVM_BUILD_DIR }}
          cmake --build llvm-project/build -j"$(nproc)" --target install

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Configure (coverage)
        run: |
          cmake -S . -B build -G Ninja \
            -DLLVM_BUILD_DIR=${{ env.LLVM_BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPERF_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run unit + acceptance tests
        run: ctest --test-dir build --output-on-failure

      - name: Collect coverage
        run: |
          lcov --capture --directory build \
               --output-file coverage.info \
               --include '*/lib/perf/*' \
               --exclude '*/test/*'
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          flags: lib
          fail_ci_if_error: false
