name: LLVM cache

# Builds the pinned LLVM/MLIR once and stores it in the Actions cache that
# ci.yml restores. Run this manually (or when bumping the LLVM version); the
# per-PR workflow never compiles LLVM from source.
on:
  workflow_dispatch:

env:
  LLVM_VERSION: llvmorg-22.1.8
  LLVM_BUILD_DIR: ${{ github.workspace }}/llvm-install

jobs:
  build-llvm:
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Only build when the cache for this LLVM version does not exist yet.
      - name: Check cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_BUILD_DIR }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-release

      - name: Clone LLVM (pinned version)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.LLVM_VERSION }} \
            https://github.com/llvm/llvm-project.git llvm-project

      - name: Build LLVM + MLIR
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCMAKE_INSTALL_PREFIX=${{ env.LLVM_BUILD_DIR }}
          cmake --build llvm-project/build -j"$(nproc)" --target install

      - name: Cache marker
        if: steps.cache.outputs.cache-hit != 'true'
        run: touch ${{ env.LLVM_BUILD_DIR }}/.llvm-${{ env.LLVM_VERSION }}
